<!DOCTYPE html>

<head>

  <style>
   * {margin: 0;padding: 0;box-sizing: border-box }body {font-family: MontserratNormal, sans-serif; background-color: #000;}.main {padding: 40px 0 106px }.main-container {max-width: 500px;margin: 0 auto;padding: 0 20px }.main-plan {background: #000;border-radius: 30px;padding: 2px 2px 30px }.plan-header {padding: 20px 31px;border-radius: 30px 30px 0 0;margin-bottom: 24px }.line {margin: 0 auto;display: flex;object-fit: contain;width: 90%;filter: invert(1) }.plan-header-bottom {display: flex;justify-content: space-between;max-width: 335px;margin: 0 auto }.plan-header-bottom-text {font-family: MontserratSemiBold, sans-serif;font-weight: 600;font-size: 15px;text-align: center;color: #fff }.plan-title {font-family: MontserratBold, sans-serif;font-weight: 700;font-size: 16px;text-align: center;text-transform: uppercase;line-height: 100%;padding: 20px;background: #0d0d0d;border-radius: 8px;color: #fff;max-width: 420px;margin: 0 auto }.plan-date {font-family: MontserratNormal, sans-serif;font-size: 18px;text-align: center;margin-bottom: 11px;font-weight: 400 }b {font-family: MontserratBold, sans-serif;font-weight: 700 }.plan-description {font-family: MontserratBold, sans-serif;text-align: center;font-size: 16px;font-weight: 700;margin: 0 auto 10px }.center {padding: 0 20px }.plan-select-now {text-align: center;font-family: MontserratNormal, sans-serif;font-size: 12px;font-weight: 400;margin-bottom: 5px }.form {display: grid;grid-template-columns: 1fr;gap: 12px }.form__col {display: grid;grid-template-columns: 1fr }.label {font-family: MontserratSemiBold, sa  ns-serif;font-size: 16px;margin-bottom: 2px }.input {padding: 8px 12px;border-radius: 10px;border: 1px solid #000;outline: none;font-size: 18px }.plan-list-btn {font-family: MontserratSemiBold, sans-serif;width: 100%;text-align: center;background: #FE0000;border: none;padding: 9px 31px;border-radius: 8px;font-size: 18px;font-weight: 600;color: #fff;cursor: pointer;transition: all .3s;text-transform: uppercase }.title {color: #f4f4f4; font-weight: 800; line-height: 1.1; letter-spacing: 0.02em; margin-bottom: 22px; font-size: clamp(28px, 4vw, 40px); text-transform: uppercase; }.title .accent {color: #f5c76a; text-shadow: 0 0 12px rgba(245, 199, 106, 0.35); }.title .muted {color: rgba(255,255,255,0.95); }footer {background: #000;padding: 40px 0;color: #fff;text-align: center }.footer-container {max-width: 384px;margin: 0 auto;padding: 20px;display: flex;flex-direction: column;justify-content: center;gap: 20px }.footer-title {font-family: MontserratMedium, sans-serif;font-weight: 500;font-size: 16px;line-height: 1.5;text-align: center }.footer__number {padding: 0 8px;border: 1px solid #fff;max-width: 160px;margin: 0 auto;border-radius: 10px;font-family: MontserratNormal, sans-serif;font-size: 16px;color: #fff;text-decoration: none }.footer__link-telegram {background: #d1444e;padding: 8px 12px;border-radius: 10px;max-width: 289px;display: flex;align-items: center;gap: 20px;font-family: MontserratNormal, sans-serif;font-size: 16px;color: #fff;text-decoration: none;margin: 0 auto }.dropdown {width: fit-content }.dropdown__toggle {display: flex;align-items: center;justify-content: space-between;gap: 8px;cursor: pointer;padding: 10px 12px;border-radius: 10px;border: 1px solid #e6e7eb;background: #fff;user-select: none;min-height: 44px;}.selected-code {font-weight: 700 }.chev {width: 18px;height: 18px;display: inline-block;transition: transform .18s ease;opacity: .8 }.chev.open {transform: rotate(180deg);opacity: 1 }.dropdown__list {position: absolute;top: calc(100% + 8px);left: 0;width: 100%;background: #fff;border: 1px solid #e6e7eb;border-radius: 10px;box-shadow: 0 12px 30px rgba(12, 18, 31, 0.08);max-height: 215px;overflow: auto;z-index: 120;display: none;padding: 6px;}.dropdown__list.open {display: block }.dropdown__item {display: flex;justify-content: space-between;align-items: center;padding: 8px 10px;border-radius: 8px;cursor: pointer;font-size: 14px;color: #111;}.dropdown__item:hover {background: #f4f7ff }.dropdown__item[aria-selected="true"] {background: #eef6ff;font-weight: 700 }.country-name {white-space: nowrap;overflow: hidden;text-overflow: ellipsis;padding-right: 8px }.country-code {opacity: .9;font-weight: 700 }.phone-wrap {display: flex;gap: 10px;align-items: center;position: relative;}#localPhone {flex: 1;min-width: 160px }.hint {color: #6b7280;font-size: 13px;margin-top: 8px;display: block }.whatsapp_info{display: flex;align-items: center; gap: 10px;padding: 15px 0px 15px 20px; border: 1px dashed black;border-radius: 100px;margin-top: 15px;}.whatsapp_info__text{font-size: clamp(10px, 3vw, 12px); color: #474343;}
  </style>
  <link rel="stylesheet" href="./css/index.css" media="print" onload="this.media='all'">
</head>

<body>
  <section class="main">
    <div class="main-container">
      <h1 class="title">
        <span class="muted">Kursda Ishtirok</span> <span class="muted">Etish</span> <span class="muted">uchun</span> <br> <span class="accent">maXsus taklif</span>
      </h1>
      <div class="main-plan">
        <div class="plan-header">
          <img alt="Supermiya" class="line" src="./images/line.webp" width="335" height="28" loading="lazy">
          <div class="plan-header-bottom">
            <p class="plan-header-bottom-text">Ma'lumot <br> kiritish</p>
            <p class="plan-header-bottom-text">To'lov <br> qilish</p>
            <p class="plan-header-bottom-text">Yakunlash</p>
          </div>
        </div>
        <div class="center">
          <p class="plan-title">Onalik ilmi</p>
          <p class="plan-description">4 oy ichida Muxtasar Nazarova bilan farzandinggizni xatolarsiz to’g’ri tarbiyalashni o’rganing!</p>
          <p class="plan-select-now">Hoziroq formani to'ldiring va bonuslarni qolga kirting</p>
          <form id="form" class="form" novalidate>
            <div class="form__col">
              <label class="label" for="name">Ism familiyangiz:</label>
              <input id="name" name="Ism" class="input" autocomplete="name" />
            </div>

            <div class="form__col">
              <label class="label">Telefon raqamingiz:</label>
              <div class="row phone-wrap">
                <!-- custom dropdown (rendered from array) -->
                <div class="dropdown" id="countryDropdown" aria-haspopup="listbox">
                  <div id="dropdownToggle" class="dropdown__toggle" role="button" tabindex="0" aria-expanded="false"
                    aria-controls="dropdownList">
                    <span class="selected-code" id="selectedCode">+998</span>
                    <svg class="chev" id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </div>
                  <div id="dropdownList" class="dropdown__list" role="listbox" tabindex="-1" aria-label="Davlatlar">
                    <!-- items injected by JS -->
                  </div>
                </div>

                <!-- phone input -->
                <input id="localPhone" name="Telefon raqam" class="input" inputmode="numeric" placeholder="99 123-45-67"
                  required autocomplete="tel" />
              </div>
            </div>
            <div class="form__col">
              <label class="label" for="course">Tarifni tanlash:</label>
              <select id="course" name="Tarif" class="input">
                <option value="Premium" selected>Premium — 3 199 000</option>
                <option value="VIP online">VIP online — 3 599 000</option>
                <option value="VIP offline">VIP offline — 4 599 000</option>
              </select>
            </div>

            <div style="display: none; align-items: center; gap: 10px;">
              <input class="offertaCheck" type="checkbox" value="true" required checked id="check"
                style="width: 20px; height: 20px;">
              <label for="check" style="font-size: 12px;">
                <a style="color: #FF815D; text-decoration: none;"
                  href="https://docs.google.com/document/d/1iU1hu4xlmZCi4cy-TPBlVvpeEDNGgsWRV3lkQxMeuuE/edit?tab=t.0">
                  Ommaviy Offerta shartnomasi
                </a> shartlariga roziman
              </label>
            </div>
            <button type="submit" class="btn plan-list-btn">DAVOM ETISH</button>
          </form>
        </div>
      </div>
    </div>
  </section>
  <footer>
    <div class="footer-container">
      <a href="tel:+998995368090" class="footer__number">+998 99 536 80 90</a>
      <a target="_blank"
        href="https://t.me/Nazarovaaacademy"
        class="footer__link-telegram">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M9.41718 15.1853L9.02018 20.7693C9.58818 20.7693 9.83418 20.5253 10.1292 20.2323L12.7922 17.6873L18.3102 21.7283C19.3222 22.2923 20.0352 21.9953 20.3082 20.7973L23.9302 3.82531L23.9312 3.82431C24.2522 2.32831 23.3902 1.74331 22.4042 2.11031L1.11418 10.2613C-0.338822 10.8253 -0.316822 11.6353 0.867178 12.0023L6.31018 13.6953L18.9532 5.78431C19.5482 5.39031 20.0892 5.60831 19.6442 6.00231L9.41718 15.1853Z"
            fill="white"></path>
        </svg>
        Admin
      </a>
    </div>
  </footer>
  <script defer src="./js/app.js"></script>
</body>

</html>
